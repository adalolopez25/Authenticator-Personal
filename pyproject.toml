[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "authenticator"
version = "1.0.0"
description = "Authenticator TOTP de escritorio (PySide6 + Argon2id + AES-256-GCM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andres" },
]
keywords = ["totp", "2fa", "authenticator", "security", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

# Dependencias de EJECUCION (versiones verificadas en este equipo).
dependencies = [
    "PySide6==6.11.2",
    "cryptography==50.0.1",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
authenticator = "main:main"

[tool.setuptools]
packages = ["app", "ui", "ui.screens", "ui.widgets", "ui.styles", "installer", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
